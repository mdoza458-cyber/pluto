name: Update Pluto Playlists

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Prevent multiple runs from trying to update main at the same time.
concurrency:
  group: update-pluto-playlists
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Update Regional Playlists
        run: |
          set -e

          # Remove the regional playlists generated by this workflow.
          rm -f pluto_us.m3u
          rm -f pluto_ca.m3u
          rm -f pluto_gb.m3u
          rm -f pluto_de.m3u
          rm -f pluto_mx.m3u
          rm -f pluto_no.m3u
          rm -f pluto_se.m3u
          rm -f pluto_dk.m3u

          for region in us ca gb de mx no se dk; do
            echo "========================================"
            echo "Updating Pluto region: $region"
            echo "========================================"

            PLUTO_REGION="$region" python pluto_provider.py
          done

      - name: Generate Master Playlist
        run: |
          set -e
          python pluto_provider.py --merge

      - name: Commit and Push
        run: |
          set -e

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          # Stage ALL changes, not just *.m3u files.
          git add -A

          # Exit cleanly if nothing changed.
          if git diff --cached --quiet; then
            echo "No playlist changes detected."
            exit 0
          fi

          # Commit generated playlists.
          git commit -m "Update Pluto: New Regions and Improved Session IPs"

          # Get the latest version of main.
          git fetch origin main

          # Put our new commit on top of the latest main.
          git rebase origin/main

          # Push the updated main branch.
          git push origin HEAD:main
